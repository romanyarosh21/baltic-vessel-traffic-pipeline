version: 2

models:
  - name: dim_vessels
    description: One row per MMSI with the latest known static data.
    columns:
      - name: mmsi
        data_tests:
          - unique
          - not_null
      - name: vessel_class
        data_tests:
          - not_null

  - name: fct_vessels_daily
    description: Distinct vessels and messages per day, vessel class and ship type.
    columns:
      - name: activity_date
        data_tests:
          - not_null
      - name: vessel_class
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Class A", "Class B"]
      - name: ship_type
        data_tests:
          - not_null
      - name: vessels
        data_tests:
          - not_null

  - name: fct_signal_gaps
    description: >
      Pauses longer than signal_gap_minutes (default 60) between two consecutive
      messages of the same Class A vessel. A gap means the receiving system got
      nothing, not that the vessel switched AIS off: it may have left the coverage area.
    columns:
      - name: mmsi
        data_tests:
          - not_null
      - name: gap_start_ts
        data_tests:
          - not_null
      - name: gap_end_ts
        data_tests:
          - not_null
      - name: gap_minutes
        data_tests:
          - not_null